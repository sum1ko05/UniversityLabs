<!DOCTYPE html>
<html>
    <head>
        <title>PHP-FPM Lab's Form</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h2>Заказ мебели</h2>
        <form id="myForm">
            <input type="text" name="username" placeholder="Введите имя"><br>
            <input type="text" name="email" placeholder="Введите email"><br>
            <select name="model">
                <option value="wall-mounted_cabinet">Подвесная тумба</option>
                <option value="bedside_cabinet">Прикроватная тумба</option>
                <option value="chair">Стул</option>
            </select><br>
            Количество: <input type="number" name="amount" placeholder="1"><br>
            <input type="checkbox" name="assembly_included"> Сборка включена<br>
            Способ доставки: <br>
            <input type="radio" name="delivery" value="pickup_delivery"> Самовывоз<br>
            <input type="radio" name="delivery" value="home_delivery"> Доставка на дом<br>
            <button type="submit">Отправить</button>
        </form>

        <script>
            document.getElementById("myForm").addEventListener("submit", function(e) {
                e.preventDefault();
            
                const username = this.username.value;
                const email = this.email.value;
                const model = this.model.value;
                const amount = this.amount.value;
                const assembly_included = this.assembly_included.checked;
                const delivery = this.delivery.value
            
                alert(`Перепроверьте введённые данные:\n
                        Ваше имя: ${username}\n
                        Ваш email ${email}\n
                        Выбранная модель: ${model}\n
                        Количество заказанных моделей: ${amount}\n
                        Включение сборки: ${assembly_included}\n
                        Способ доставки: ${delivery}`);
            });
        </script>            
    </body>
</html>
