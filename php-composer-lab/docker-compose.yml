version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lab4_nginx
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./public/:/var/www/html
      - ./vendor/:/var/www/html/vendor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  php:
    image: php:8.2-fpm
    container_name: lab4_php
    volumes:
      - ./public/:/var/www/html
      - ./vendor/:/var/www/html/vendor
    expose:
      - "9000"
