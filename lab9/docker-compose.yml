services:
  nginx:
    image: nginx:1.29-alpine
    container_name: lab9_nginx
    ports:
      - "8080:80"
    volumes:
      - ./public/:/var/www/html
      - ./app/:/var/www/app
      - ./tests/:/var/www/tests
      - ./vendor/:/var/www/vendor
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
  php:
    build:
      context: .
      dockerfile: ./config/Dockerfile
    container_name: lab9_php
    env_file:
      - .env
    volumes:
      - ./public/:/var/www/html
      - ./app/:/var/www/app
      - ./tests/:/var/www/tests
      - ./vendor/:/var/www/vendor
    expose:
      - "9000"
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: lab9_db
    env_file:
      - .env
    ports:
      - "3307:3306"
    volumes:
      - ./database/:/var/lib/mysql
      - ./config/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  adminer:
    image: adminer
    container_name: lab9_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - db